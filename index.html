<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flama Minimalista Animada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111827; /* Fondo oscuro */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .flame-container {
      position: relative;
      width: 150px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Resplandor místico de fondo */
    .glow {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.4) 0%, rgba(168, 85, 247, 0.2) 50%, transparent 70%);
      border-radius: 50%;
      bottom: 20px;
      animation: pulse 2s ease-in-out infinite alternate;
    }

    /* Capa exterior de la flama (Llama grande morada/rosada) */
    .flame-outer {
      position: absolute;
      width: 100px;
      height: 140px;
      background: linear-gradient(180deg, #ec4899 0%, #a855f7 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform-origin: bottom center;
      animation: flameMotion 1.8s ease-in-out infinite alternate;
      clip-path: polygon(50% 0%, 80% 30%, 100% 70%, 80% 100%, 20% 100%, 0% 70%, 20% 30%);
      border-top-left-radius: 400px;
    }

    /* Capa interior de la flama (Núcleo brillante) */
    .flame-inner {
      position: absolute;
      width: 50px;
      height: 80px;
      background: linear-gradient(180deg, #ffffff 0%, #f472b6 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      bottom: 10px;
      transform-origin: bottom center;
      animation: innerMotion 1.2s ease-in-out infinite alternate;
    }

    /* Movimiento suave de parpadeo y balanceo */
    @keyframes flameMotion {
      0% {
        transform: scale(1) rotate(-2deg);
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      }
      50% {
        transform: scale(1.04, 0.96) rotate(2deg);
      }
      100% {
        transform: scale(0.98, 1.03) rotate(-1deg);
        border-radius: 40% 60% 50% 50% / 70% 50% 50% 30%;
      }
    }

    @keyframes innerMotion {
      0% {
        transform: scale(1) rotate(1deg);
      }
      100% {
        transform: scale(0.9, 1.1) rotate(-2deg);
      }
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      100% { opacity: 0.9; transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <div class="flame-container">
    <div class="glow"></div>
    <div class="flame-outer"></div>
    <div class="flame-inner"></div>
  </div>

</body>
</html>
